name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') { $v = $Matches[1] } else { $v = $tag }
          if (-not $v) { $v = "0.0.0-dev" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Generate icon.ico
        shell: pwsh
        # Use the real Windows Qt platform plugin (not "offscreen") so the
        # font system has access to GDI fonts like Segoe UI. The offscreen
        # plugin ships with no fonts and renders text as empty glyphs.
        run: python tools/generate_icon.py

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm KeepDesktop.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepDesktop-Setup
          path: Output\KeepDesktop-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KeepDesktop ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: Output\KeepDesktop-Setup-*.exe
